name: Render and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        
      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        
      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
          
      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::ggplot2
            any::knitr
            any::rmarkdown
            any::devtools
            
      - name: Install bueller package
        run: |
          R -e "devtools::install('.', dependencies = TRUE)"
          
      - name: Copy example files to docs before render
        run: |
          cp inst/templates/engagement-template.html docs/
          
      - name: Render Quarto Project
        uses: quarto-dev/quarto-actions/render@v2
        with:
          path: docs

      - name: Copy DOCX to built site
        run: |
          cp inst/templates/engagement-template.docx docs/
          
      - name: Upload to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site
          
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4